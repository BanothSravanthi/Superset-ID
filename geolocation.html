<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Event Locator</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
        #output { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

    <!-- Step 1: Create the button -->
    <button id="find-btn">Find Nearby Events</button>
    <div id="output"></div>

    <script>
        const button = document.getElementById('find-btn');
        const output = document.getElementById('output');

        // Step 2: Set high accuracy and timeout options
        const geoOptions = {
            enableHighAccuracy: true,
            timeout: 10000, // 10 seconds
            maximumAge: 0
        };

        // Success callback function
        function success(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            output.style.color = "green";
            output.innerHTML = `Success! Your coordinates are:<br>Latitude: ${lat}<br>Longitude: ${lng}`;
        }

        // Step 3: Handle errors (Permission denial, timeouts, etc.)
        function error(err) {
            output.style.color = "red";
            switch(err.code) {
                case err.PERMISSION_DENIED:
                    output.innerText = "Error: You denied the request for Geolocation.";
                    break;
                case err.POSITION_UNAVAILABLE:
                    output.innerText = "Error: Location information is unavailable.";
                    break;
                case err.TIMEOUT:
                    output.innerText = "Error: The request to get your location timed out.";
                    break;
                default:
                    output.innerText = "Error: An unknown error occurred.";
                    break;
            }
        }

        // Step 4: Add click event listener to the button
        button.addEventListener('click', () => {
            output.style.color = "black";
            output.innerText = "Locating your position...";

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, error, geoOptions);
            } else {
                output.style.color = "red";
                output.innerText = "Error: Geolocation is not supported by your browser.";
            }
        });
    </script>

</body>
</html>
