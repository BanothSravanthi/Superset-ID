<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Feedback Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background-color: #f9f9f9;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], select, textarea {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .error {
            color: red;
            font-size: 14px;
            margin-top: 5px;
            display: none;
        }
        .fee-display {
            font-weight: bold;
            color: #2c3e50;
            margin-top: 5px;
        }
        .char-count {
            font-size: 12px;
            color: #666;
            text-align: right;
            margin-top: 5px;
        }
        .img-container {
            text-align: center;
            margin: 20px 0;
        }
        .event-img {
            width: 150px;
            transition: transform 0.3s ease;
            cursor: pointer;
            border: 2px solid #ddd;
            border-radius: 8px;
        }
        .event-img.large {
            transform: scale(2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <h2>Event Feedback & Interaction Form</h2>
    <p style="font-size: 13px; color: #555;">💡 Tip: Double-click the badge image to enlarge it!</p>

    <form id="feedbackForm" onsubmit="event.preventDefault();">
        
        <!-- 1. Blur Event: Phone Validation -->
        <div class="form-group">
            <label for="phone">Phone Number (10 digits):</label>
            <input type="text" id="phone" placeholder="e.g., 9876543210">
            <div id="phoneError" class="error">Please enter a valid 10-digit phone number.</div>
        </div>

        <!-- 2. Change Event: Dropdown Fee -->
        <div class="form-group">
            <label for="eventSelect">Select Event:</label>
            <select id="eventSelect">
                <option value="">-- Choose an Event --</option>
                <option value="$0 (Free)">Tech Webinar</option>
                <option value="$50">Design Workshop</option>
                <option value="$120">AI Conference</option>
            </select>
            <div id="feeDisplay" class="fee-display">Cost: $0</div>
        </div>

        <!-- 3. Double-Click Event: Image Enlarge -->
        <div class="form-group img-container">
            <label>Event Verified Badge:</label>
            <img id="eventBadge" class="event-img" src="https://picsum.photos" alt="Event Badge">
        </div>

        <!-- 4. Keyboard Event: Character Counter -->
        <div class="form-group">
            <label for="feedback">Your Feedback:</label>
            <textarea id="feedback" rows="4" placeholder="Type your thoughts here..."></textarea>
            <div id="charCount" class="char-count">Characters: 0</div>
        </div>

        <!-- 5. Click Event: Submit Confirmation -->
        <button id="submitBtn">Submit Feedback</button>

    </form>

    <script>
        // --- 1. Phone Validation (onblur) ---
        const phoneInput = document.getElementById('phone');
        const phoneError = document.getElementById('phoneError');

        phoneInput.onblur = function() {
            // Regular expression for exactly 10 digits
            const phonePattern = /^\d{10}$/; 
            if (!phonePattern.test(phoneInput.value)) {
                phoneError.style.display = 'block';
                phoneInput.style.borderColor = 'red';
            } else {
                phoneError.style.display = 'none';
                phoneInput.style.borderColor = '#ccc';
            }
        };

        // --- 2. Dropdown Fee Display (onchange) ---
        const eventSelect = document.getElementById('eventSelect');
        const feeDisplay = document.getElementById('feeDisplay');

        eventSelect.onchange = function() {
            const selectedFee = eventSelect.value;
            if (selectedFee) {
                feeDisplay.textContent = `Cost: ${selectedFee}`;
            } else {
                feeDisplay.textContent = 'Cost: $0';
            }
        };

        // --- 3. Image Zoom (ondblclick) ---
        const eventBadge = document.getElementById('eventBadge');

        eventBadge.ondblclick = function() {
            eventBadge.classList.toggle('large');
        };

        // --- 4. Character Counter (oninput / keyboard events) ---
        const feedbackTextarea = document.getElementById('feedback');
        const charCountDiv = document.getElementById('charCount');

        feedbackTextarea.oninput = function() {
            const count = feedbackTextarea.value.length;
            charCountDiv.textContent = `Characters: ${count}`;
        };

        // --- 5. Submit Confirmation (onclick) ---
        const submitBtn = document.getElementById('submitBtn');

        submitBtn.onclick = function() {
            // Run a quick check on the phone before letting them confirm
            const phonePattern = /^\d{10}$/;
            if (!phonePattern.test(phoneInput.value)) {
                alert('Please fix the errors in the form before submitting.');
                return;
            }
            
            // Show confirmation dialog
            const confirmed = confirm('Are you sure you want to submit this feedback?');
            if (confirmed) {
                alert('Thank you! Your feedback has been saved.');
                // Reset form fields
                document.getElementById('feedbackForm').reset();
                feeDisplay.textContent = 'Cost: $0';
                charCountDiv.textContent = 'Characters: 0';
                eventBadge.classList.remove('large');
            }
        };
    </script>
</body>
</html>
