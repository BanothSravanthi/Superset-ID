<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Community Events Gallery</title>
    <style>
        /* Styles the main table layout */
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        /* Styles the caption text at the top */
        caption {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        /* Centers content inside the table cells */
        td {
            padding: 10px;
            text-align: center;
        }
        /* Applies a border and shadow to the images using a class */
        .event-photo {
            border: 5px solid #333333;
            border-radius: 8px;
            width: 100%;
            max-width: 300px;
            height: auto;
            box-shadow: 3px 3px 8px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
