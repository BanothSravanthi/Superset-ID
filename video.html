<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Promo Video</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        #statusMessage {
            color: green;
            font-weight: bold;
            margin-top: 10px;
        }
        .form-section {
            margin-top: 30px;
            padding: 15px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>

    <h1>Event Promo Video</h1>

    <!-- Task: Video element with source and controls -->
    <!-- Task: oncanplay event displays a message -->
    <video id="promoVideo" width="480" controls oncanplay="videoReady()">
        <source src="https://w3schools.com" type="video/mp4">
        Your browser does not support the video tag.
    </video>

    <div id="statusMessage">Loading video...</div>

    <!-- Form section to test the onbeforeunload event -->
    <div class="form-section">
        <h2>RSVP for the Event</h2>
        <form>
            <label for="name">Your Name:</label>
            <input type="text" id="name" placeholder="Enter your name"><br><br>
            <input type="submit" value="Submit">
        </form>
    </div>

    <script>
        // Function for oncanplay event
        function videoReady() {
            document.getElementById("statusMessage").innerText = "Video ready to play!";
        }

        // Task: onbeforeunload to warn users before leaving
        window.onbeforeunload = function() {
            return "You have unfinished forms. Are you sure you want to leave?";
        };
    </script>

</body>
</html>
