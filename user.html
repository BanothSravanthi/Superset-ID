<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User Preferences</title>
    <style>
        body { font-family: sans-serif; margin: 20px; }
        .box { margin-bottom: 15px; }
    </style>
</head>
<body>

    <h2>Event Preferences</h2>

    <!-- Dropdown to pick event type -->
    <div class="box">
        <label for="eventDropdown">Preferred Event Type:</label>
        <select id="eventDropdown">
            <option value="">-- Choose One --</option>
            <option value="music">Music Festivals</option>
            <option value="sports">Sports Games</option>
            <option value="tech">Tech Conferences</option>
            <option value="art">Art Gallery Shows</option>
        </select>
    </div>

    <!-- Button to clear storage -->
    <button id="clearBtn">Clear Preferences</button>

    <script>
        // Get HTML elements
        const dropdown = document.getElementById('eventDropdown');
        const clearBtn = document.getElementById('clearBtn');

        // 1. Retrieve and pre-select on reload
        window.addEventListener('DOMContentLoaded', () => {
            const savedEvent = localStorage.getItem('preferredEvent');
            if (savedEvent) {
                dropdown.value = savedEvent;
            }
        });

        // 2. Save selected event type on change
        dropdown.addEventListener('change', () => {
            const selectedValue = dropdown.value;
            localStorage.setItem('preferredEvent', selectedValue);
            
            // Also saving something to sessionStorage for testing purposes
            sessionStorage.setItem('sessionActive', 'true');
        });

        // 3. Clear preferences button
        clearBtn.addEventListener('click', () => {
            localStorage.removeItem('preferredEvent'); // Clears specific item
            sessionStorage.clear();                    // Clears all session storage
            dropdown.value = '';                       // Resets dropdown UI
            alert('Preferences cleared!');
        });
    </script>

</body>
</html>
