<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DevTools Debugging Practice</title>
    <style>
        .box-container {
            display: flex;
            background-color: #f0f0f0;
            padding: 20px;
        }
        .box {
            /* BUG: This high width breaks the flex layout row */
            width: 80%; 
            background-color: #007bff;
            color: white;
            padding: 20px;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>DevTools Test Page</h1>
    
    <div class="box-container">
        <div class="box">Box 1</div>
        <div class="box">Box 2</div>
        <div class="box">Box 3</div>
    </div>

    <button id="bugBtn">Click to Count</button>
    <p>Total Count: <span id="counter">0</span></p>

    <script>
        let count = 0;
        const button = document.getElementById('bugBtn');
        const display = document.getElementById('counter');

        button.addEventListener('click', () => {
            console.log('Button was clicked!');
            
            // BUG: wrongElement does not exist, causing a script error
            const badNode = document.getElementById('wrongElement');
            badNode.innerText = "Error!"; 

            count = count + 1;
            display.innerText = count;
        });
    </script>
</body>
</html>
